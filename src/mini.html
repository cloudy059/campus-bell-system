<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>迷你悬浮条</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: transparent; overflow: hidden; }
    :root {
      --bg: rgba(13, 18, 34, .93); --fg: #e8edf7; --muted: #93a0b8;
      --accent: #6f9bff; --hover: rgba(255, 255, 255, .1); --line: rgba(128, 140, 170, .28);
    }
    body[data-theme='light'] {
      --bg: rgba(250, 251, 253, .96); --fg: #1d2434; --muted: #5c6679;
      --accent: #3d6fe0; --hover: rgba(0, 0, 0, .08); --line: rgba(40, 50, 70, .18);
    }
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    #bar {
      display: flex; align-items: center; height: 100%; gap: 10px;
      padding: 0 6px 0 14px; cursor: pointer; user-select: none;
      background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    .m-clock {
      font-size: 14px; font-weight: 700; color: var(--fg);
      font-variant-numeric: tabular-nums; letter-spacing: .5px; white-space: nowrap;
    }
    .m-sep { width: 1px; height: 18px; background: var(--line); flex-shrink: 0; }
    .m-next { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .m-next svg { width: 13px; height: 13px; color: var(--accent); flex-shrink: 0; }
    #m-bell { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-count { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .m-exam {
      flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 3px 9px;
      border-radius: 9px; white-space: nowrap;
      color: var(--accent); background: rgba(111, 155, 255, .13); border: 1px solid var(--line);
    }
    .m-exam.live { color: #ffc46b; background: rgba(255, 196, 107, .12); }
    .hidden { display: none !important; }
    .m-close {
      width: 24px; height: 24px; border: none; border-radius: 7px; flex-shrink: 0;
      background: transparent; color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .m-close:hover { background: var(--hover); color: #ff6b6b; }
    .m-close svg { width: 12px; height: 12px; }
  </style>
</head>
<body>
  <div id="bar" title="点击打开主窗口">
    <span class="m-clock" id="m-clock">--:--:--</span>
    <span class="m-sep"></span>
    <span class="m-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span id="m-bell">加载中…</span>
      <span class="m-count" id="m-count"></span>
    </span>
    <span class="m-exam hidden" id="m-exam" title="考试播报状态"></span>
    <button class="m-close" id="m-close" title="隐藏迷你条（托盘菜单可重新开启）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <script src="mini.js"></script>
</body>
</html>
